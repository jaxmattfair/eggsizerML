# .github/workflows/release.yml
name: Release

on:
  pull_request:
    types: [opened, reopened]
    title:
      - '.*<<!nav>>:bookmark:<<!/nav>>.*' # filter for releases
      
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Tag
        uses: K-Phoen/semver-release-action@master
        with:
          release_branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
